apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-renewer
  namespace: aigc
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-renewer
  namespace: aigc
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [aigc-tls]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-renewer
  namespace: aigc
subjects:
  - kind: ServiceAccount
    name: tls-renewer
    namespace: aigc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tls-renewer
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-renewer-token
  namespace: aigc
  annotations:
    kubernetes.io/service-account.name: tls-renewer
type: kubernetes.io/service-account-token
